<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>曾仕强《论三国智慧》86集</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      color: #1f2933;
      background: #f5f7fa;
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #ffffff;
      border-bottom: 1px solid #d9e2ec;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .note {
      font-size: 13px;
      color: #52606d;
    }
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: calc(100vh - 64px);
    }
    nav {
      overflow: auto;
      padding: 14px;
      background: #ffffff;
      border-right: 1px solid #d9e2ec;
    }
    button {
      width: 100%;
      min-height: 48px;
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      background: #ffffff;
      color: #243b53;
      text-align: left;
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
    }
    button:hover,
    button.active {
      border-color: #2f80ed;
      background: #eef5ff;
      color: #102a43;
    }
    .viewer {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #eef2f7;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 8px 14px;
      background: #ffffff;
      border-bottom: 1px solid #d9e2ec;
      gap: 12px;
    }
    #currentTitle {
      font-weight: 700;
      font-size: 15px;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
      white-space: nowrap;
      font-size: 14px;
    }
    a:hover { text-decoration: underline; }
    .panel {
      display: grid;
      align-content: center;
      justify-items: center;
      min-height: 420px;
      padding: 24px;
      text-align: center;
      background: #ffffff;
    }
    .panel p {
      max-width: 620px;
      margin: 0 0 18px;
      color: #52606d;
      line-height: 1.7;
    }
    .primary {
      width: auto;
      min-width: 220px;
      padding: 12px 18px;
      border-color: #1a73e8;
      background: #1a73e8;
      color: #ffffff;
      text-align: center;
      font-weight: 700;
    }
    .primary:hover {
      background: #1558b0;
      color: #ffffff;
    }
    @media (max-width: 820px) {
      header {
        height: auto;
        min-height: 64px;
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 14px;
        gap: 4px;
      }
      main {
        grid-template-columns: 1fr;
        height: auto;
      }
      nav {
        max-height: 290px;
        border-right: 0;
        border-bottom: 1px solid #d9e2ec;
      }
      .bar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>曾仕强《论三国智慧》86集</h1>
    <div class="note">本地目录文件，播放加载B站公开视频页面，需要联网；实查公开完整目录为86集。</div>
  </header>
  <main>
    <nav id="playlist"></nav>
    <section class="viewer">
      <div class="bar">
        <span id="currentTitle"></span>
        <a id="openLink" href="#" target="_blank" rel="noopener">在浏览器新窗口打开</a>
      </div>
      <div class="panel">
        <p>B站页面通常不允许嵌入本地文件内播放。请选择左侧集数，然后点击下方按钮在浏览器新窗口打开公开视频页。</p>
        <button id="openButton" class="primary" type="button">打开当前集</button>
      </div>
    </section>
  </main>
  <script>
    const bvid = "BV1J5G26YEfK";
    const titles = [
      "不打不相识",
      "得意勿忘形",
      "恶人怕得势",
      "妄言害自己",
      "群雄讨董卓",
      "连环美人计",
      "全凭动脑筋",
      "三让徐州",
      "换来的江山",
      "隔山观虎斗",
      "千万勿轻敌",
      "想好再说话",
      "不义必自毙",
      "煮酒论英雄",
      "借力解纷争",
      "降汉不降曹",
      "身在曹营心在汉",
      "千里走单骑",
      "兄弟重聚义",
      "孙策之死",
      "说话的艺术",
      "官渡之战",
      "一举定北方",
      "言多必有失",
      "良才甚择主",
      "走马荐诸葛",
      "无三不成礼",
      "初次显身手",
      "仁义的是非",
      "舌战群儒",
      "巧计联东吴",
      "明合暗斗",
      "蒋干盗书",
      "草船借箭",
      "两厢都情愿",
      "巧献连环计",
      "自负难回头",
      "巧计借东风",
      "败走华容道",
      "巧占城池",
      "英雄惜英雄",
      "巧破美人计",
      "弄假成真",
      "赔了夫人又折兵",
      "无意借荆州",
      "诚意能沟通",
      "离间计风云",
      "天赐的礼物",
      "政治的婚姻",
      "命丧落凤坡",
      "为义而成友",
      "以智夺西川",
      "情假戏要真",
      "待人先待心",
      "用心方能赢",
      "巧计赢强敌",
      "聪明反害己",
      "水淹七军",
      "关公走麦城",
      "曹操之死",
      "相煎何太急",
      "亲征伐吴",
      "火烧连营",
      "化敌为友",
      "南征平乱",
      "欲擒故纵",
      "七擒又七纵",
      "坚决要北伐",
      "老年慎择徒",
      "司马懿复出",
      "挥泪斩马谡",
      "司马懿取印",
      "棋逢对手",
      "坎坷北伐路",
      "木牛流马计",
      "火烧上方谷",
      "死后能杀人",
      "司马懿夺权",
      "富不过三代",
      "兵困铁笼山",
      "司马昭之心",
      "危机四伏",
      "生死阴平关",
      "自作自受",
      "三国人物",
      "三国之道"
    ];
    const episodes = titles.map((title, index) => {
      const number = String(index + 1).padStart(2, "0");
      return [`${number} ${title}`, `https://www.bilibili.com/video/${bvid}?p=${index + 1}`];
    });

    const playlist = document.getElementById("playlist");
    const currentTitle = document.getElementById("currentTitle");
    const openLink = document.getElementById("openLink");
    const openButton = document.getElementById("openButton");
    const buttons = [];
    let currentUrl = "";

    function loadEpisode(index) {
      const [title, url] = episodes[index];
      currentTitle.textContent = title;
      openLink.href = url;
      currentUrl = url;
      buttons.forEach((button, i) => button.classList.toggle("active", i === index));
    }

    episodes.forEach(([title], index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = title;
      button.addEventListener("click", () => loadEpisode(index));
      playlist.appendChild(button);
      buttons.push(button);
    });

    loadEpisode(0);
    openButton.addEventListener("click", () => {
      window.open(currentUrl, "_blank", "noopener");
    });
  </script>
</body>
</html>
